# QOO-227: native GPMC CLI via CodSpeed's exec harness.
# Validates the ACTUAL QuPRS integration boundary: fresh GPMC process.
# Inputs are generated by the pinned original QuPRS test, NOT encoder-emitted.
$schema: https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json

benchmarks:
  - name: "gpmc/quprs_direct/unconstrained"
    exec: "./build-quprs-bench/gpmc -mode=1 -prec=30 build-quprs-bench/quprs-cnf/unconstrained.cnf"
  - name: "gpmc/quprs_direct/forced_sat"
    exec: "./build-quprs-bench/gpmc -mode=1 -prec=30 build-quprs-bench/quprs-cnf/forced-sat.cnf"
  - name: "gpmc/quprs_direct/contradictory_unsat"
    exec: "./build-quprs-bench/gpmc -mode=1 -prec=30 build-quprs-bench/quprs-cnf/contradictory-unsat.cnf"
  - name: "gpmc/quprs_direct/disjunction"
    exec: "./build-quprs-bench/gpmc -mode=1 -prec=30 build-quprs-bench/quprs-cnf/disjunction.cnf"
  - name: "gpmc/quprs_direct/xor"
    exec: "./build-quprs-bench/gpmc -mode=1 -prec=30 build-quprs-bench/quprs-cnf/xor.cnf"
  - name: "gpmc/quprs_direct/complex_cancellation"
    exec: "./build-quprs-bench/gpmc -mode=1 -prec=30 build-quprs-bench/quprs-cnf/complex-cancellation.cnf"
