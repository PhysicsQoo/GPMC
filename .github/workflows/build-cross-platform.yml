name: Build GPMC on supported platforms

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Avoid retaining expensive builds from superseded edits to the same PR.
# Independent master pushes and manual runs remain non-cancelling.
concurrency:
  group: gpmc-build-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: build/gpmc
          - os: macos-15
            binary: build/gpmc
          - os: windows-2022
            binary: build/gpmc.exe

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Report the precise PR branch HEAD, not the synthetic merge SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Ensure Linux build dependencies (reuse runner, bounded retry)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for package in libgmp-dev libmpfr-dev zlib1g-dev; do
            if [[ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != 'install ok installed' ]]; then
              missing+=("$package")
            fi
          done
          if ! command -v cmake >/dev/null 2>&1; then missing+=(cmake); fi
          if ! command -v ninja >/dev/null 2>&1; then missing+=(ninja-build); fi
          if (( ${#missing[@]} )); then
            printf 'Missing Ubuntu build packages: %s\n' "${missing[*]}"
            # Contact apt only if required packages are missing from the runner.
            installed=false
            for attempt in 1 2 3; do
              printf 'APT attempt %s/3\n' "$attempt"
              if sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
                && sudo apt-get install -y --no-install-recommends \
                    -o Acquire::Retries=2 -o Acquire::http::Timeout=20 "${missing[@]}"; then
                installed=true
                break
              fi
              # Azure hosted mirror DNS can fail independently of the
              # official Ubuntu archive. Try an independently resolving
              # official mirror once; never turn a missing dependency into PASS.
              if (( attempt == 1 )) && [[ -f /etc/apt/apt-mirrors.txt ]] \
                  && grep -q 'azure.archive.ubuntu.com' /etc/apt/apt-mirrors.txt; then
                if getent ahostsv4 archive.ubuntu.com >/dev/null 2>&1; then
                  sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
                  echo 'Using official Ubuntu archive after Azure mirror fetch failure.'
                else
                  echo 'Official Ubuntu archive DNS also unavailable; retaining fail-closed retries.'
                fi
              fi
              if (( attempt < 3 )); then sleep "$((attempt * 10))"; fi
            done
            if [[ "$installed" != true ]]; then
              echo 'Required Ubuntu build packages unavailable after bounded retry (DNS/mirror outage).' >&2
              exit 1
            fi
          else
            echo 'All Linux build dependencies already present: skipping apt/network.'
          fi
          cmake --version | head -n 1
          ninja --version
          for package in libgmp-dev libmpfr-dev zlib1g-dev; do
            test "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null)" = 'install ok installed'
          done

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install gmp mpfr zlib cmake ninja

      - name: Set up Windows UCRT64 toolchain and dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-zlib

      - name: Configure, build and smoke (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export CMAKE_PREFIX_PATH="$(brew --prefix gmp);$(brew --prefix mpfr);$(brew --prefix zlib)"
          fi
          cmake --preset release
          cmake --build --preset release --parallel 2
          test -x build/gpmc
          bash .github/scripts/scientific-smoke.sh build/gpmc | tee build/scientific-smoke.out
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # QuPRS packaging uses the static-dependency option on macOS.
            cmake -S . -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release -DGPMC_STATIC_BUILD=ON
            cmake --build build-static --parallel 2
            test -x build-static/gpmc
            bash .github/scripts/scientific-smoke.sh build-static/gpmc | tee build-static/scientific-smoke.out
            otool -L build-static/gpmc | tee build-static/dynamic-dependencies.out
            if grep -E '(libgmp|libgmpxx|libmpfr).*\\.dylib' build-static/dynamic-dependencies.out; then
              echo "GPMC_STATIC_BUILD unexpectedly depends on dynamic GMP/MPFR" >&2
              exit 1
            fi
          fi
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            python3 .github/scripts/scientific_oracle.py build/gpmc | tee build/independent-oracle.out
          else
            printf 'Linux-only independent exact Fraction oracle; native smoke ran here.\n' > build/independent-oracle.out
          fi
          printf 'p cnf 1 1\n1 0\n' > build/gpmc-smoke.cnf
          build/gpmc -mode=0 build/gpmc-smoke.cnf > build/gpmc-smoke.out
          grep -Eq '^c s exact arb int 1$' build/gpmc-smoke.out
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            shasum -a 256 build/gpmc > build/gpmc.sha256
          else
            sha256sum build/gpmc > build/gpmc.sha256
          fi
          git rev-parse HEAD > build/source-revision.txt
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            shasum -a 256 -c build/gpmc.sha256
          else
            sha256sum -c build/gpmc.sha256
          fi
          {
            printf 'tested_checkout_sha=%s\n' "$(cat build/source-revision.txt)"
            printf 'pr_head_sha=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}'
            printf 'base_sha=%s\n' '${{ github.event.pull_request.base.sha || github.sha }}'
            printf 'runner=%s/%s\n' "${{ runner.os }}" "${{ runner.arch }}"
            cmake --version | sed -n '1p'
            c++ --version | sed -n '1p'
            if [[ "${{ runner.os }}" == "Linux" ]]; then
              dpkg-query -W -f='${Package} ${Version}\n' libgmp-dev libmpfr-dev zlib1g-dev
              for package in cmake ninja-build; do
                if ! dpkg-query -W -f='${Package} ${Version}\n' "$package" 2>/dev/null; then
                  command_name="$package"
                  if [[ "$package" == 'ninja-build' ]]; then command_name=ninja; fi
                  printf '%s runner_tool=%s\n' "$package" "$(command -v "$command_name")"
                fi
              done
            else
              brew list --versions gmp mpfr zlib cmake ninja
            fi
            grep -E '^GPMC_.*_(INCLUDE_DIR|LIBRARY):' build/CMakeCache.txt || true
          } > build/build-provenance.txt

      - name: Configure, build and smoke (Windows UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --preset release
          cmake --build --preset release --parallel 2
          test -x build/gpmc.exe
          bash .github/scripts/scientific-smoke.sh build/gpmc.exe | tee build/scientific-smoke.out
          printf 'Linux-only independent exact Fraction oracle; native smoke ran here.\n' > build/independent-oracle.out
          printf 'p cnf 1 1\n1 0\n' > build/gpmc-smoke.cnf
          build/gpmc.exe -mode=0 build/gpmc-smoke.cnf > build/gpmc-smoke.out
          grep -Eq '^c s exact arb int 1$' build/gpmc-smoke.out
          sha256sum build/gpmc.exe > build/gpmc.sha256
          printf '%s\n' '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}' > build/source-revision.txt
          sha256sum -c build/gpmc.sha256
          {
            printf 'tested_checkout_sha=%s\n' "$(cat build/source-revision.txt)"
            printf 'pr_head_sha=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}'
            printf 'base_sha=%s\n' '${{ github.event.pull_request.base.sha || github.sha }}'
            printf 'runner=%s/%s\n' "${{ runner.os }}" "${{ runner.arch }}"
            cmake --version | sed -n '1p'
            c++ --version | sed -n '1p'
            pacman -Q mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-gmp mingw-w64-ucrt-x86_64-mpfr mingw-w64-ucrt-x86_64-zlib
            grep -E '^GPMC_.*_(INCLUDE_DIR|LIBRARY):' build/CMakeCache.txt || true
          } > build/build-provenance.txt

      - name: Upload tested binary and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpmc-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ matrix.binary }}
            build/gpmc.sha256
            build/source-revision.txt
            build/gpmc-smoke.out
            build/scientific-smoke.out
            build/independent-oracle.out
            build/build-provenance.txt
          if-no-files-found: error
